name: Crawl

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      budget:
        description: "Seconds to spend crawling"
        default: "16200"
      skip_discover:
        description: "Skip the discovery phase"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore database
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/db-restore.sh

      - name: Discover new items
        if: inputs.skip_discover != true
        env:
          APK_ARCHIVE_UA: "apk-archive/0.1 (+https://github.com/${{ github.repository }})"
        run: python -m crawler --budget 600 discover

      - name: Crawl item metadata
        env:
          APK_ARCHIVE_UA: "apk-archive/0.1 (+https://github.com/${{ github.repository }})"
        run: python -m crawler --budget ${{ inputs.budget || 16200 }} crawl

      - name: Store database
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/db-store.sh

      - name: Commit stats
        run: bash scripts/commit-stats.sh "crawl"
