name: Deploy site

on:
  workflow_run:
    workflows: [Update]
    types: [completed]
  schedule:
    - cron: "5 6 * * *"
  workflow_dispatch:
    inputs:
      min_enriched:
        description: "Refuse to publish below this many enriched rows"
        default: "0"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "crawler/export.py"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore database
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/db-restore.sh

      - name: Export web database
        run: |
          mkdir -p web/data
          python -m crawler export --out web/data/apk.sqlite.png \
            --min-enriched ${{ inputs.min_enriched || 0 }}

      - name: Report published size
        run: du -sh web web/data/apk.sqlite.png

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
