name: Update

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      crawl_budget:
        description: "Seconds to spend crawling"
        default: "5400"
      enrich_budget:
        description: "Seconds to spend enriching"
        default: "10800"
      skip_discover:
        description: "Skip the discovery phase"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: database
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      APK_ARCHIVE_UA: "apk-archive/0.1 (+https://github.com/${{ github.repository }})"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore database
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/db-restore.sh

      - name: Discover new items
        if: inputs.skip_discover != true
        run: python -m crawler --budget 600 discover

      - name: Crawl item metadata
        run: python -m crawler --budget ${{ inputs.crawl_budget || 5400 }} crawl

      - name: Extract manifests
        run: python -m crawler --budget ${{ inputs.enrich_budget || 10800 }} enrich

      - name: Store database
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/db-store.sh

      - name: Commit stats
        run: bash scripts/commit-stats.sh "update"
